<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? "light") === "dark";
    const colors = {
      bg: dark ? "#121316" : "#F7F5F1",
      surface: dark ? "#1C1E22" : "#FFFFFF",
      border: dark ? "#2A2D31" : "#E7E3DC",
      textPrimary: dark ? "#F2F1EE" : "#1B1D1F",
      textSecondary: dark ? "#9B978F" : "#6B6862",
      expense: dark ? "#E08A52" : "#C1662E",
      expenseTint: dark ? "#332419" : "#F6E9DE",
      navInactive: dark ? "#5C5F64" : "#B7B2A8"
    };
    return { colors };
  }
}
</script>
