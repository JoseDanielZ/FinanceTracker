<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bienvenida — Inicio de sesión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;}
*{box-sizing:border-box;}
a{text-decoration:none;}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{colors.bg}};font-family:'IBM Plex Sans',sans-serif;color:{{colors.textPrimary}};position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:64px 28px 48px;">

  <div></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:18px;background:{{colors.surface}};border:1px solid {{colors.border}};display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:12px 14px;">
      <div style="width:6px;height:12px;border-radius:3px;background:{{colors.income}};"></div>
      <div style="width:6px;height:20px;border-radius:3px;background:{{colors.income}};"></div>
      <div style="width:6px;height:28px;border-radius:3px;background:{{colors.income}};"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.02em;">FinanceTracker</div>
      <div style="font-size:14px;color:{{colors.textSecondary}};line-height:1.4;max-width:240px;">Tus ingresos y gastos, sin complicaciones.</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <a href="Summary.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;background:{{colors.income}};color:#FFFFFF;font-size:16px;font-weight:600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8V6.5A1.5 1.5 0 0 1 6.5 5H8"/><path d="M16 5h1.5A1.5 1.5 0 0 1 19 6.5V8"/><path d="M19 16v1.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 19H6.5A1.5 1.5 0 0 1 5 17.5V16"/><circle cx="9.3" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="14.7" cy="10.5" r="1" fill="currentColor" stroke="none"/><path d="M9.5 14.5c1 .9 4 .9 5 0"/></svg>
      Continuar con Face ID
    </a>
    <a href="#" style="display:flex;align-items:center;justify-content:center;height:50px;border-radius:16px;background:transparent;color:{{colors.textPrimary}};font-size:15px;font-weight:600;border:1px solid {{colors.border}};">Iniciar sesión con contraseña</a>
    <a href="#" style="display:flex;align-items:center;justify-content:center;font-size:13px;color:{{colors.textSecondary}};padding-top:4px;">¿Olvidaste tu contraseña?</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? "light") === "dark";
    const colors = {
      bg: dark ? "#121316" : "#F7F5F1",
      surface: dark ? "#1C1E22" : "#FFFFFF",
      border: dark ? "#2A2D31" : "#E7E3DC",
      textPrimary: dark ? "#F2F1EE" : "#1B1D1F",
      textSecondary: dark ? "#9B978F" : "#6B6862",
      income: dark ? "#3FA6AE" : "#1F6F78"
    };
    return { colors };
  }
}
</script>
</body>
</html>
