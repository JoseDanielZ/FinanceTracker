<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presupuestos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;}
*{box-sizing:border-box;}
a{text-decoration:none;}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{colors.bg}};font-family:'IBM Plex Sans',sans-serif;color:{{colors.textPrimary}};position:relative;overflow:hidden;">

  <div style="padding:52px 20px 0;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;">Presupuestos</div>
      <a href="#" style="font-size:14px;font-weight:600;color:{{colors.textPrimary}};">+ Nuevo</a>
    </div>
    <div style="font-size:13px;color:{{colors.textSecondary}};margin-top:-10px;">Septiembre 2026</div>

    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="background:{{colors.surface}};border:1px solid {{colors.border}};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:10px;background:{{colors.expenseTint}};display:flex;align-items:center;justify-content:center;color:{{colors.expense}};flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9"/><path d="M7 3v5"/><path d="M10 3v5"/><path d="M17 3c-1.5 0-2.5 1.8-2.5 5s1 5 2.5 5v9"/></svg></div>
          <div style="font-size:14px;font-weight:600;flex:1;">Comida</div>
          <div style="font-size:13px;color:{{colors.textSecondary}};">$180 / $250</div>
        </div>
        <div style="height:7px;border-radius:999px;background:{{colors.surfaceAlt}};overflow:hidden;"><div style="width:72%;height:100%;background:{{colors.expense}};border-radius:999px;"></div></div>
        <div style="font-size:12px;font-weight:500;color:{{colors.expense}};">Cerca del límite · 72%</div>
      </div>

      <div style="background:{{colors.surface}};border:1px solid {{colors.border}};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:10px;background:{{colors.incomeTint}};display:flex;align-items:center;justify-content:center;color:{{colors.income}};flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-4h10l2 4v5"/><path d="M5 16h14"/><circle cx="8" cy="17.5" r="1.4"/><circle cx="16" cy="17.5" r="1.4"/></svg></div>
          <div style="font-size:14px;font-weight:600;flex:1;">Transporte</div>
          <div style="font-size:13px;color:{{colors.textSecondary}};">$60 / $150</div>
        </div>
        <div style="height:7px;border-radius:999px;background:{{colors.surfaceAlt}};overflow:hidden;"><div style="width:40%;height:100%;background:{{colors.income}};border-radius:999px;"></div></div>
        <div style="font-size:12px;font-weight:500;color:{{colors.income}};">Dentro del presupuesto · 40%</div>
      </div>

      <div style="background:{{colors.surface}};border:1px solid {{colors.border}};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:10px;background:{{colors.expenseTint}};display:flex;align-items:center;justify-content:center;color:{{colors.expense}};flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 14h5l-1 7 8-11h-5l1-7z"/></svg></div>
          <div style="font-size:14px;font-weight:600;flex:1;">Servicios</div>
          <div style="font-size:13px;color:{{colors.textSecondary}};">$142 / $150</div>
        </div>
        <div style="height:7px;border-radius:999px;background:{{colors.surfaceAlt}};overflow:hidden;"><div style="width:95%;height:100%;background:{{colors.expense}};border-radius:999px;"></div></div>
        <div style="font-size:12px;font-weight:500;color:{{colors.expense}};">Cerca del límite · 95%</div>
      </div>

      <div style="background:{{colors.surface}};border:1px solid {{colors.border}};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:10px;background:{{colors.overTint}};display:flex;align-items:center;justify-content:center;color:{{colors.over}};flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="12" height="10" rx="1.5"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg></div>
          <div style="font-size:14px;font-weight:600;flex:1;">Ocio</div>
          <div style="font-size:13px;color:{{colors.textSecondary}};">$210 / $180</div>
        </div>
        <div style="height:7px;border-radius:999px;background:{{colors.surfaceAlt}};overflow:hidden;"><div style="width:100%;height:100%;background:{{colors.over}};border-radius:999px;"></div></div>
        <div style="font-size:12px;font-weight:600;color:{{colors.over}};">Excedido · 117%</div>
      </div>

    </div>

  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:88px;background:{{colors.surface}};border-top:1px solid {{colors.border}};display:flex;align-items:flex-start;padding:10px 8px 0;">
    <a href="Summary.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{colors.navInactive}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
      <span style="font-size:11px;font-weight:500;">Resumen</span>
    </a>
    <a href="Income.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{colors.navInactive}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v7"/><path d="M8.5 11l3.5 3.5L15.5 11"/></svg>
      <span style="font-size:11px;font-weight:500;">Ingresos</span>
    </a>
    <a href="Expenses.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{colors.navInactive}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-7"/><path d="M8.5 13l3.5-3.5L15.5 13"/></svg>
      <span style="font-size:11px;font-weight:500;">Gastos</span>
    </a>
    <a href="Budgets.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{colors.textPrimary}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg>
      <span style="font-size:11px;font-weight:600;">Presupuestos</span>
    </a>
    <a href="History.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{colors.navInactive}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg>
      <span style="font-size:11px;font-weight:500;">Historial</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? "light") === "dark";
    const colors = {
      bg: dark ? "#121316" : "#F7F5F1",
      surface: dark ? "#1C1E22" : "#FFFFFF",
      surfaceAlt: dark ? "#24262B" : "#EFEBE4",
      border: dark ? "#2A2D31" : "#E7E3DC",
      textPrimary: dark ? "#F2F1EE" : "#1B1D1F",
      textSecondary: dark ? "#9B978F" : "#6B6862",
      income: dark ? "#3FA6AE" : "#1F6F78",
      incomeTint: dark ? "#1B3236" : "#E4EFEE",
      expense: dark ? "#E08A52" : "#C1662E",
      expenseTint: dark ? "#332419" : "#F6E9DE",
      over: dark ? "#E2694F" : "#9B3A26",
      overTint: dark ? "#332019" : "#F5E1DC",
      navInactive: dark ? "#5C5F64" : "#B7B2A8"
    };
    return { colors };
  }
}
</script>
</body>
</html>
